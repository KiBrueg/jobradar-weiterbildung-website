server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Block backend files — must not be served
    location ~* \.(py|txt|sh|bat|db|sqlite3|log|bak|env)$ {
        return 403;
    }

    # Hashed assets: cache forever, 404 if missing (no SPA fallback)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000, immutable";
    }

    # Static root files (svg, ico, etc.)
    location ~* \.(svg|ico|png|jpg|webp|woff2|woff|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "max-age=86400";
    }

    # SPA routes — no-cache so browser always revalidates index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
